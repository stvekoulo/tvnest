<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">How TVNest works</title>
  <desc id="desc">1. You add your own IPTV source: M3U link or file, Xtream Codes, Stalker portal, XMLTV guide. 2. TVNest imports it into a local library on your PC: Live TV, movies, series, guide, favorites and resume points. 3. You watch in the built-in player, or in MPV or VLC.</desc>
  <rect width="1200" height="380" rx="28" fill="#050505"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="27.5" fill="none" stroke="#1F1F1F"/>
    <g transform="translate(64 64)">
    <rect width="320" height="252" rx="22" fill="#0F0F0F" stroke="#262626"/>
    <text x="28" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#A3A3A3">01 · YOUR SOURCE</text>
    <text x="28" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#F5F5F4">Add a provider</text>
    <text x="28" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">M3U / M3U8 link or file</text>
    <text x="28" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Xtream Codes account</text>
    <text x="28" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Stalker portal (MAC)</text>
    <text x="28" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">XMLTV programme guide</text>
    </g>
    <path d="M394 190 h36 m-10 -10 l10 10 l-10 10" fill="none" stroke="#525252" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(440 64)">
    <rect width="320" height="252" rx="22" fill="#0F0F0F" stroke="#262626"/>
    <text x="28" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#A3A3A3">02 · ON YOUR PC</text>
    <text x="28" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#F5F5F4">One library</text>
    <text x="28" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Live TV, movies, series</text>
    <text x="28" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Groups, filters, search</text>
    <text x="28" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Favorites and history</text>
    <text x="28" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Resume where you left</text>
    </g>
    <path d="M770 190 h36 m-10 -10 l10 10 l-10 10" fill="none" stroke="#525252" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(816 64)">
    <rect width="320" height="252" rx="22" fill="#0F0F0F" stroke="#262626"/>
    <text x="28" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#A3A3A3">03 · PLAYBACK</text>
    <text x="28" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#F5F5F4">Watch</text>
    <text x="28" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Built-in player (mpv)</text>
    <text x="28" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Next episode, resume</text>
    <text x="28" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Audio and subtitle tracks</text>
    <text x="28" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#D4D4D4">Open in MPV or VLC</text>
    </g>
  <g transform="translate(1030 90)">
    <rect width="82" height="28" rx="14" fill="#E11D48"/>
    <circle cx="17" cy="14" r="5" fill="#FFFFFF"/>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">LIVE</text>
  </g>
</svg>
