# Installeur Windows TVNest, construit sur le runner auto-hébergé (machine locale).
# Un runner auto-hébergé ne consomme aucune minute GitHub Actions.
#
# - push sur master / lancement manuel : installeur .exe copié dans TVNEST_INSTALLERS_DIR
# - tag v* (ex. v0.26.0) : installeur publié dans une Release GitHub (mise à jour auto)
name: Build Windows installer

on:
    push:
        branches: [master]
        tags: ['v*']
    workflow_dispatch:

concurrency:
    group: build-windows-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    windows:
        name: Windows x64 (.exe)
        runs-on: [self-hosted, Windows, X64]
        timeout-minutes: 90
        defaults:
            run:
                # Windows PowerShell 5.1 : disponible pour le compte de service du runner.
                # Bypass limité à ce processus (la politique de la machine reste inchangée).
                # `exit $LASTEXITCODE` : sans lui, une commande native en échec en fin d'étape passerait.
                shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'; exit $LASTEXITCODE"
        env:
            NX_DAEMON: 'false'
            NX_NO_CLOUD: 'true'
            IPTVNATOR_EMBEDDED_MPV_PLATFORM: win32
            IPTVNATOR_EMBEDDED_MPV_ARCH: x64
            IPTVNATOR_REQUIRE_EMBEDDED_MPV: '1'
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # pnpm local au dépôt (pas d'installation globale sur la machine).
            - name: Install pnpm
              run: |
                  npm install --no-save --prefix .pnpm-cli pnpm@10.33.0
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.pnpm-cli\node_modules\.bin" -Encoding ascii

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  npm ci --prefix apps/web

            - name: Resolve pinned Windows Embedded MPV runtime
              id: mpv-pin
              run: node tools/embedded-mpv/windows-runtime-pin.mjs --github-output

            - name: Stage Windows Embedded MPV runtime
              run: >
                  pnpm embedded-mpv:stage-runtime:windows-archive --
                  "${{ steps.mpv-pin.outputs.url }}" "${{ steps.mpv-pin.outputs.sha256 }}"

            - name: Build installer
              if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
              run: pnpm run make:app -- --publishPolicy=never

            # electron-builder envoie ses fichiers en parallèle : sans release existante, chaque
            # envoi en crée une et le tag se retrouve avec des releases en double.
            - name: Create GitHub release
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: >
                  gh release create $env:GITHUB_REF_NAME --draft --verify-tag --generate-notes
                  --title ("TVNest " + $env:GITHUB_REF_NAME.TrimStart('v'))

            - name: Build and publish release
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm run make:app -- --publishPolicy=always

            # Publiée seulement une fois complète : la mise à jour auto ne voit jamais de release partielle.
            - name: Publish GitHub release
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest

            # Pas d'artefact GitHub (quota de stockage du compte indisponible) : l'installeur est
            # copié sur la machine du runner, dans TVNEST_INSTALLERS_DIR (défini dans le .env du runner).
            - name: Copy installer to local folder
              run: |
                  if (-not $env:TVNEST_INSTALLERS_DIR) {
                      Write-Output "::warning::TVNEST_INSTALLERS_DIR absent du .env du runner : installeur laissé dans dist/executables."
                      exit 0
                  }
                  $dest = Join-Path $env:TVNEST_INSTALLERS_DIR ("{0}-{1}" -f $env:GITHUB_REF_NAME, $env:GITHUB_SHA.Substring(0, 7))
                  New-Item -ItemType Directory -Force $dest | Out-Null
                  Copy-Item dist/executables/*.exe, dist/executables/*.blockmap, dist/executables/latest.yml -Destination $dest
                  Write-Output "Installeur copié dans $dest"
