# Installeur Windows TVNest, construit sur le runner auto-hébergé (machine locale).
# Un runner auto-hébergé ne consomme aucune minute GitHub Actions.
#
# - push sur master / lancement manuel : installeur .exe copié dans TVNEST_INSTALLERS_DIR
# - tag v* (ex. v1.1.0) : installeur publié dans une Release GitHub (mise à jour auto)
name: Build Windows installer

on:
    push:
        branches: [master]
        tags: ['v*']
    workflow_dispatch:

concurrency:
    group: build-windows-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    windows:
        name: Windows x64 (.exe)
        runs-on: [self-hosted, Windows, X64]
        timeout-minutes: 90
        defaults:
            run:
                shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'; exit $LASTEXITCODE"
        env:
            NODE_ENV: 'production'
            NX_DAEMON: 'false'
            NX_NO_CLOUD: 'true'
            IPTVNATOR_EMBEDDED_MPV_PLATFORM: win32
            IPTVNATOR_EMBEDDED_MPV_ARCH: x64
            IPTVNATOR_REQUIRE_EMBEDDED_MPV: '1'
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Verify release tag matches package.json version
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              run: |
                  $pkg = Get-Content -Raw package.json | ConvertFrom-Json
                  $expectedTag = "v$($pkg.version)"
                  if ($env:GITHUB_REF_NAME -ne $expectedTag) {
                      Write-Error "Le tag Git ($env:GITHUB_REF_NAME) ne correspond pas à package.json ($expectedTag)."
                      exit 1
                  }

            - name: Install pnpm
              run: |
                  npm install --no-save --prefix .pnpm-cli pnpm@10.33.0
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.pnpm-cli\node_modules\.bin" -Encoding ascii

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile

            - name: Run typechecks and regression tests
              run: |
                  pnpm run typecheck:ci
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  pnpm run test:web
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  pnpm nx test electron-backend -- --maxWorkers=2 --testPathIgnorePatterns=embedded-mpv-frame-copy --testPathIgnorePatterns=embedded-mpv-linux --testPathIgnorePatterns=embedded-mpv-native.service.reconnect --testPathIgnorePatterns=download-file-path --testPathIgnorePatterns=download-catchup-transfer --testPathIgnorePatterns=epg-worker.service --testPathIgnorePatterns=legacy-profile-recovery --testPathIgnorePatterns=playlist-open-request

            - name: Resolve pinned Windows Embedded MPV runtime
              id: mpv-pin
              run: node tools/embedded-mpv/windows-runtime-pin.mjs --github-output

            - name: Stage Windows Embedded MPV runtime (with runner archive cache)
              env:
                  MPV_ARCHIVE_URL: ${{ steps.mpv-pin.outputs.url }}
                  MPV_ARCHIVE_SHA256: ${{ steps.mpv-pin.outputs.sha256 }}
                  MPV_ARCHIVE_NAME: ${{ steps.mpv-pin.outputs.asset_name }}
              run: |
                  $cacheRoot = if ($env:TVNEST_MPV_CACHE_DIR) { $env:TVNEST_MPV_CACHE_DIR } else { Join-Path $env:LOCALAPPDATA 'TVNest\ci-cache\mpv-winbuild' }
                  New-Item -ItemType Directory -Force $cacheRoot | Out-Null
                  $fileName = if ($env:MPV_ARCHIVE_NAME) { $env:MPV_ARCHIVE_NAME } else { "$($env:MPV_ARCHIVE_SHA256).7z" }
                  $cachedFile = Join-Path $cacheRoot $fileName
                  $useCached = $false
                  if (Test-Path $cachedFile) {
                      $actualHash = (Get-FileHash -Path $cachedFile -Algorithm SHA256).Hash.ToLowerInvariant()
                      if ($actualHash -eq $env:MPV_ARCHIVE_SHA256.ToLowerInvariant()) {
                          Write-Output "Archive libmpv vérifiée trouvée dans le cache local : $cachedFile"
                          $useCached = $true
                      } else {
                          Remove-Item -Force $cachedFile -ErrorAction SilentlyContinue
                      }
                  }
                  if (-not $useCached) {
                      Write-Output "Téléchargement et mise en cache de l'archive libmpv : $env:MPV_ARCHIVE_URL"
                      Invoke-WebRequest -Uri $env:MPV_ARCHIVE_URL -OutFile $cachedFile -UseBasicParsing
                      $actualHash = (Get-FileHash -Path $cachedFile -Algorithm SHA256).Hash.ToLowerInvariant()
                      if ($actualHash -ne $env:MPV_ARCHIVE_SHA256.ToLowerInvariant()) {
                          Remove-Item -Force $cachedFile -ErrorAction SilentlyContinue
                          Write-Error "Checksum SHA-256 invalide pour $cachedFile (attendu: $env:MPV_ARCHIVE_SHA256, reçu: $actualHash)."
                          exit 1
                      }
                  }
                  pnpm embedded-mpv:stage-runtime:windows-archive -- "$cachedFile" "$env:MPV_ARCHIVE_SHA256"

            - name: Clean stale installer outputs
              run: |
                  if (Test-Path dist/executables) {
                      Remove-Item -Recurse -Force dist/executables
                  }

            - name: Build installer
              if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
              run: pnpm run make:app -- --publishPolicy=never --parallel=1

            - name: Create GitHub release
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $tags = gh release list --limit 50 --json tagName --jq '.[].tagName'
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  if ($tags -contains $env:GITHUB_REF_NAME) {
                      Write-Output "Release $env:GITHUB_REF_NAME déjà créée : réutilisée."
                      exit 0
                  }
                  gh release create $env:GITHUB_REF_NAME --draft --verify-tag --generate-notes --title ("TVNest " + $env:GITHUB_REF_NAME.TrimStart('v'))

            - name: Build and publish release
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm run make:app -- --publishPolicy=always --parallel=1

            - name: Verify packaged Electron layout
              run: node tools/packaging/verify-electron-package-layout.mjs windows x64

            - name: Publish GitHub release
              if: ${{ startsWith(github.ref, 'refs/tags/v') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest

            - name: Copy installer to local folder
              run: |
                  if (-not $env:TVNEST_INSTALLERS_DIR) {
                      Write-Output "::warning::TVNEST_INSTALLERS_DIR absent du .env du runner : installeur laissé dans dist/executables."
                      exit 0
                  }
                  $dest = Join-Path $env:TVNEST_INSTALLERS_DIR ("{0}-{1}" -f $env:GITHUB_REF_NAME, $env:GITHUB_SHA.Substring(0, 7))
                  New-Item -ItemType Directory -Force $dest | Out-Null
                  Copy-Item dist/executables/*.exe, dist/executables/*.blockmap, dist/executables/latest.yml -Destination $dest
                  Write-Output "Installeur copié dans $dest"
